<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1a30"/>
      <stop offset="32%" stop-color="#33507a"/>
      <stop offset="58%" stop-color="#8177a0"/>
      <stop offset="78%" stop-color="#dd8f76"/>
      <stop offset="100%" stop-color="#f4cf94"/>
    </linearGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6f95"/>
      <stop offset="100%" stop-color="#465682"/>
    </linearGradient>
    <linearGradient id="midRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a72"/>
      <stop offset="100%" stop-color="#2c3a5e"/>
    </linearGradient>
    <linearGradient id="peakFace" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#232f4d"/>
      <stop offset="100%" stop-color="#141d34"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Mond -->
  <circle cx="1310" cy="150" r="46" fill="#f7ecd2" opacity="0.9"/>
  <circle cx="1296" cy="138" r="46" fill="url(#sky)" opacity="0.55"/>

  <!-- Sterne -->
  <g fill="#f6f2e6">
    <circle cx="140" cy="90" r="2.2" opacity="0.8"/>
    <circle cx="260" cy="150" r="1.6" opacity="0.6"/>
    <circle cx="420" cy="70" r="2" opacity="0.7"/>
    <circle cx="600" cy="130" r="1.6" opacity="0.55"/>
    <circle cx="80" cy="220" r="1.8" opacity="0.6"/>
    <circle cx="980" cy="60" r="1.8" opacity="0.65"/>
    <circle cx="1120" cy="110" r="1.5" opacity="0.5"/>
    <circle cx="1480" cy="80" r="2" opacity="0.7"/>
    <circle cx="1550" cy="200" r="1.6" opacity="0.55"/>
  </g>

  <!-- Vogel-Piktogramme -->
  <g stroke="#1c2740" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M300,240 Q316,224 332,240 Q348,224 364,240"/>
    <path d="M370,270 Q384,256 398,270 Q412,256 426,270"/>
  </g>

  <!-- Ferner Bergzug -->
  <path fill="url(#farRange)" opacity="0.55"
    d="M0,660 L90,600 190,645 300,570 410,625 520,555 640,615 770,560 890,630 1010,575 1130,640 1260,585 1390,650 1520,600 1600,635 L1600,900 L0,900 Z"/>

  <!-- Mittlerer Bergzug -->
  <path fill="url(#midRange)" opacity="0.8"
    d="M0,720 L130,555 250,635 360,510 480,605 610,470 730,600 850,530 970,650 1090,555 1210,660 1330,590 1460,675 1600,610 L1600,900 L0,900 Z"/>

  <!-- Matterhorn -->
  <path fill="url(#peakFace)"
    d="M560,720 L700,515 860,165 935,320 1005,430 1090,565 1230,720 L1230,900 L560,900 Z"/>
  <!-- Ostgrat (helle Kante) -->
  <path fill="#2c3a5e" opacity="0.6" d="M860,165 L935,320 1005,430 1090,565 1055,565 975,435 915,330 860,200 Z"/>

  <!-- Schneekappe -->
  <path fill="#eef3f8" opacity="0.96" d="M860,165 L813,300 830,320 862,300 900,255 920,320 940,318 Z"/>
  <!-- Schneestreifen am Grat -->
  <path fill="#eef3f8" opacity="0.85" d="M935,320 L965,335 1015,440 995,450 Z"/>
  <path fill="#eef3f8" opacity="0.7" d="M700,515 L730,530 760,570 740,585 710,545 Z"/>

  <!-- Nadelbäume (Piktogramme) -->
  <g fill="#141c30">
    <path d="M120,860 L150,790 180,860 Z"/>
    <path d="M136,900 L164,900 158,860 142,860 Z"/>
    <path d="M200,880 L222,825 244,880 Z"/>
    <path d="M1360,870 L1392,800 1424,870 Z"/>
    <path d="M1378,900 L1406,900 1400,870 1384,870 Z"/>
    <path d="M1440,885 L1462,835 1484,885 Z"/>
  </g>
</svg>
