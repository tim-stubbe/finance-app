# Von xcodegen (https://github.com/yonaskolb/XcodeGen) erzeugtes Kies.xcodeproj
# - das eigentliche Kies.xcodeproj wird generiert und NICHT von Hand
# gepflegt, diese Datei hier ist die Quelle der Wahrheit. Grund für den
# Umweg statt direkt ein .xcodeproj zu committen: eine .pbxproj-Datei ist
# UUID-referenziertes Binärformat-nahes XML - von Hand editiert (oder von
# einem Werkzeug ohne Xcode-GUI geschrieben) korrumpiert sie leicht auf eine
# Art, die sich erst beim Öffnen in Xcode zeigt. project.yml ist reiner,
# diff-freundlicher Text und wird deterministisch neu generiert.
#
# Warum überhaupt ein echtes Xcode-Projekt, wenn Package.swift bisher
# gereicht hat: App-Extensions (WidgetKit-Widget, Share-Extension) können
# NUR als eingebettete Targets eines echten Xcode-App-Targets existieren -
# das kann ein reines SPM-Executable-Target (wie KiesiOS bisher) nicht
# leisten. KiesCore/Kies(macOS)/KiesCLI bleiben unverändert reines SPM,
# siehe Package.swift.
#
# Neu generieren nach jeder Änderung an dieser Datei:
#   cd macos/Kies && xcodegen generate
# (xcodegen: `brew install xcodegen`)
#
# Danach in Xcode öffnen: Kies.xcodeproj (NICHT Package.swift, wenn Widget/
# Share-Extension gebraucht werden). Schema "KiesiOS" wählen, Team unter
# Signing & Capabilities für jedes der drei Targets (KiesiOS, KiesWidget,
# KiesShare) setzen (Automatic Signing reicht) - das ist der einzige
# Schritt, der zwingend von Hand in Xcode passieren muss (Apple-Account-
# Zuordnung lässt sich nicht ohne Weiteres automatisieren/committen).

name: Kies
options:
  bundleIdPrefix: app.kies
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true

packages:
  KiesCorePackage:
    path: .

targets:
  KiesiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/KiesiOS
    dependencies:
      - package: KiesCorePackage
        product: KiesCore
      - target: KiesWidget
        embed: true
      - target: KiesShare
        embed: true
    entitlements:
      path: Sources/KiesiOS/KiesiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.kies
        # Apple-Health-Import (Sources/KiesiOS/Health/HealthKitSync.swift) -
        # nur Lesen (Schritte/Ruhepuls/Gewicht/Schlaf), kein Clinical-Records-
        # Zugriff, daher .access leer.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kies.KiesiOS
        PRODUCT_NAME: Kies
        INFOPLIST_FILE: Sources/KiesiOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Platzhalter-Icon (blauer Grund, "K") - siehe Sources/KiesiOS/
        # Assets.xcassets/AppIcon.appiconset. Einfach die icon-1024.png dort
        # ersetzen, sobald es ein echtes Icon gibt, kein weiterer Schritt nötig.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO

  KiesWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/KiesWidget
    dependencies:
      - package: KiesCorePackage
        product: KiesCore
    entitlements:
      path: Sources/KiesWidget/KiesWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.kies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kies.KiesiOS.KiesWidget
        PRODUCT_NAME: KiesWidget
        INFOPLIST_FILE: Sources/KiesWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  KiesShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/KiesShare
    dependencies:
      - package: KiesCorePackage
        product: KiesCore
    entitlements:
      path: Sources/KiesShare/KiesShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.kies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kies.KiesiOS.KiesShare
        PRODUCT_NAME: KiesShare
        INFOPLIST_FILE: Sources/KiesShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

schemes:
  KiesiOS:
    build:
      targets:
        KiesiOS: all
        KiesWidget: all
        KiesShare: all
    run:
      config: Debug
    archive:
      config: Release
