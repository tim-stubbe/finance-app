# Alembic-Konfiguration fuer die Kies-CLI-Nutzung:
#   cd backend && alembic revision --autogenerate -m "beschreibung"
#   cd backend && alembic upgrade head        # (die App macht das beim Start selbst)
#
# Zur Laufzeit ruft die App Alembic programmatisch auf (app/db_migrate.py) und
# baut die Config dort im Code - diese Datei ist NUR fuer die CLI.

[alembic]
script_location = alembic
prepend_sys_path = .
# Die URL wird in env.py aus app.database gezogen (DATA_DIR), damit CLI und
# App garantiert dieselbe DB treffen. Hier nur ein Platzhalter.
sqlalchemy.url = sqlite:///./_cli_placeholder.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
